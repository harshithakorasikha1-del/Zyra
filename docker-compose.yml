version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: messaging-app-db
    environment:
      MONGO_INITDB_DATABASE: messaging_app
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - messaging-app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: messaging-app-backend
    environment:
      MONGODB_URI: mongodb://mongodb:27017/messaging_app
      JWT_SECRET: your_jwt_secret_here
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - messaging-app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: messaging-app-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - messaging-app

volumes:
  mongo_data:

networks:
  messaging-app:
    driver: bridge
